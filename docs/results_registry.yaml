# Public result registry for the paper artifact.
#
# This file records the eight claims used by the manuscript. It is intentionally not a lab
# notebook: one claim links to one compact, tracked evidence receipt and its focused test. The
# receipt contains exact source hashes and the irreducible numeric record; plans, operational
# history, large banks, and superseded attempts remain outside the public citation closure.

schema_version: 1

study_scope:
  model: meta-llama/Llama-3.1-8B-Instruct
  model_count: 1
  setting: controlled pressure and structured-action development banks
  generalization: no cross-model, deployment, or universal-deception claim
  outcomes: >-
    Structured actions and scenario truth are machine-scored. Natural-pressure commitment and
    secondary prose channels use blinded LLM judges and have not been human-validated.

paper_scope:
  primary: [C9, C10, C5]
  supporting: [C1, C12]
  negative: [C2, C11, C13]
  descriptive: [C14_DESCRIPTIVE]

branches:
  structured_action_control:
    role: main
    abbrev: SAC
    read_as: >-
      Conditional action correction in an offline, oracle-routed field. The field is generated
      with oracle true-status routing, so deceptive states expose only the corrective-target
      candidates and every policy is equally route-constrained on deceptive rows. CNG applies an
      unconstrained argmax over the candidates available in that field and matches the supplied
      route on all honest rows where both targets remain available; the fixed linear coordinate
      explicitly maps the route to a target. The weaker learned ranker receives the same route as
      a feature but chooses counter-target candidates on 233 honest rows. This comparison does
      not isolate target inference or a geometry-specific primitive, and is not an end-to-end
      deception controller.
  natural_prose_control:
    role: main
    abbrev: NPC
    read_as: >-
      Fresh, prospectively specified development generation on held-out scenario families, using
      the pre-action context without oracle true-status routing.
  natural_pressure:
    role: main
    abbrev: NATP
    read_as: >-
      Graded conversational-pressure banks used to establish the behavior and its temporal
      correlates.
  activation_state_audit:
    role: main
    abbrev: ASA
    read_as: >-
      Held-out-family comparisons of post-commitment decodability and pre-commitment warning.
  pilot_steering_decomposition:
    role: diagnostic
    abbrev: PSD
    read_as: >-
      A small nonfactorial pilot auditing direction choice alongside gate, dose, and token scope.
  gauge_control:
    role: diagnostic
    abbrev: GGC
    read_as: >-
      Retrospective one-step four-layer structured-action replay, generic-transport controls, and
      a separately gated holonomy instrument.

results:
  - id: c1_matched_control_audit
    branch: structured_action_control
    status: done
    produced_by: experiments/report_powered150_matched_control_audit.py
    artifact: paper_artifacts/c1_matched_control_audit.json
    artifact_state: tracked
    metric_summary: >-
      Offline saved-candidate field, 600 deceptive and 600 honest rows: CNG uses an unconstrained
      argmax over the route-conditioned candidate menu, fixes 599/600 with 1/600 honest harm, and
      selects the supplied route on all 1,200 rows. The deceptive menus already contain only the
      corrective target. A held-out-family ridge receives the same route as a feature, fixes
      170/600 with 11/600 harms, and selects 233 counter-target candidates on honest rows. A
      retrospective hard-route-matched fixed bidirectional-linear L16 alpha96 reconstruction
      fixes 600/600 with zero harm. The legacy 539/600 floor pooled counter-target candidates.
    claim: C1
    descriptive_companions:
      - id: c1_descriptive_structural_hierarchy
        status: unregistered_descriptive
        produced_by: experiments/report_powered150_matched_control_audit.py
        receipt: paper_artifacts/c1_matched_control_audit.json
        statement: >-
          The saved-field hierarchy compares a route-feature ridge (170/600), historical
          route floor (539/600), product-Z2 selector (581/600), chart-distilled selector
          (584/600), graph mean (598/600), and CNG (599/600). These BF16 results are
          retrospective, oracle-route-conditioned, held-out-family evaluations; no
          candidate post-action margins or outcomes enter the response-blind selectors.
          The locality proxy compares fixes from local versus locality-removed global
          flow over saved candidates (275/600 versus 52/600). Separately, a 4-bit L20
          linear gate makes 1,680/1,680 PASS/FAIL/abstain routing predictions across 12
          held-out fresh families drawn from the same data-generating process; this is
          routing-only, not OOD, generation, or control. A separate underpowered 4-bit
          fresh atlas directionally exceeds its route floor (71/100 versus 64/100; CI
          touches zero), while response-aware atlas and margin argmax tie at 79/100.
          A receipt-bound Apollo
          representation-transfer audit across different tasks/constructions reports
          .629 versus .816, .514 versus .782, and .571 versus .865 — this is
          different-task representation transfer, not within-benchmark or behavioral
          controller. No successful OOD, behavioral-controller transfer, or causal
          explanation claim is implied.
        boundary: >-
          Retrospective saved-candidate field with oracle true-status routing.
          Held-out-family evaluation only, not OOD or generation. Fresh atlas is
          4-bit, underpowered (CI touches zero), and tests within-construction
          fresh-family generalization. Apollo transfer is receipt-bound
          representation transfer across different tasks/constructions; it provides
          no machine-checkable target/behavioral controller and no causal
          attribution. Numbers are descriptive; the companion does not revise C1's
          supported status or its registered verdict.

  - id: c2_dose_control_receipt
    branch: structured_action_control
    status: done
    produced_by: experiments/report_public_steering_receipts.py
    artifact: paper_artifacts/c2_dose_control_receipt.json
    artifact_state: tracked
    metric_summary: >-
      Across 1,200 generated structured-action rows, learned dense dose and fixed alpha88/96/128
      each fix 591/600 deceptive statuses; learned dose adds 5/600 honest status harms versus zero
      and lowers mean strict reward from 0.2908 to 0.2883.
    claim: C2

  - id: c5_natural_prose_control_receipt
    branch: natural_prose_control
    status: done
    produced_by: experiments/report_public_natural_prose_control_receipt.py
    artifact: paper_artifacts/c5_natural_prose_control_receipt.json
    artifact_state: tracked
    metric_summary: >-
      Prospectively specified development L16 residual control on 96 rows over four held-out
      families: native gating changes deceptive status by 0.0000; the frequently firing policy
      changes it by -0.0833; the family-matched linear comparator reaches +0.3333, comprising 21
      deceptive fixes and 5 harms. Its four family effects are +0.4167, +0.5000, +0.0833, and
      +0.3333. The frequent policy fires on 47/48 deceptive and 37/48 honest rows, showing poor
      selectivity. Family-resampling intervals are descriptive with only four clusters.
    claim: C5
    descriptive_companions:
      - id: c5_descriptive_free_prose_readout
        status: unregistered_descriptive
        produced_by: experiments/report_public_natural_prose_control_receipt.py
        receipt: paper_artifacts/c5_natural_prose_control_receipt.json
        statement: >-
          A no-Z2 free-prose sign channel reads the machine-scored corrective target
          at 0.98579 versus 0.61559 for a forced-global-Z2 baseline on a separate
          four-family held-out split, not C5's 96 behavioral rows. This is a
          readout-only statistic from the controller
          receipt, computed after the behavioral endpoint was already scored. It does
          not imply a local Z2 involution,
          chart-level gauge structure, or geometric control leverage; it is
          compatible with chart-local structure but does not prove local symmetry
          decomposition or selective intervention. It cannot rescue the registered
          behavioral failure of C5.
        boundary: >-
          Post-hoc readout on a different four-family held-out split after the
          behavioral endpoint was settled. Not a prospective or confirmatory
          analysis. Compatible with
          chart-local structure but does not establish geometric control superiority,
          local gauge invariance, or a Z2 decomposition that could have been used for
          intervention. The forced-global-Z2 comparator is a single fixed sign
          partition applied across all families; it was not selected or optimized for
          this comparison. This companion is readout-only and does not revise C5's
          refuted status.

  - id: c9_pressure_commitment_receipt
    branch: natural_pressure
    status: done
    produced_by: experiments/report_public_natpress_receipt.py
    artifact: paper_artifacts/c9_pressure_commitment_receipt.json
    artifact_state: tracked
    metric_summary: >-
      Smooth pressure yields deceptive commitment in 26/32 scripted and 45/48 adaptive cases;
      smooth-minus-late-compressed effects are +0.31 CI [+0.04, +0.55] and +0.21875
      CI [+0.0545, +0.3961], using conversation-level Newcombe intervals. Current intensity
      is positively associated in-bank; only the history increment was tested held-out and adds
      no held-out log-loss value. The dissociation estimate uses 84/96 conversations after
      registered exclusions and retains realized intensity/history correlation +0.332. An
      adequate post-hoc commitment axis (AUC 0.920) finds no registered smooth-versus-step
      approach-drift difference: -0.020 CI [-0.145, +0.108].
    claim: C9
    descriptive_companions:
      - id: c9_descriptive_pressure_flow
        status: unregistered_descriptive
        produced_by: experiments/report_public_natpress_receipt.py
        receipt: paper_artifacts/c9_pressure_commitment_receipt.json
        statement: >-
          Across 1,800 anchor pseudo-orbits spanning the seven assigned pressure levels,
          pre-response states deepen monotonically with pressure intensity (median
          depth Spearman 0.714 on two independent depth measures), and consecutive-level
          displacement fields are nearly identical across scenario families (median
          cross-family field cosine 0.907). This is a descriptive one-parameter monotone
          flow: pressure mounts along a shared field direction rather than accumulating
          as an unstructured scalar. The orbits are pseudo-orbits with offset RNG seeds;
          reversibility, closure, and true group structure were not tested. The result
          is in-sample, pressure/text-confounded (pressure schedules, scenario text, and
          assistant replies all co-vary across orbit positions), and does not imply a
          group action, semigroup structure, causal pressure-to-depth law, or universal
          transfer across models or constructions.
        boundary: >-
          Purely descriptive, in-sample on the same natural-pressure development
          banks used for C9. RNG seeds are offset between orbit positions; orbits
          are not true group orbits. Pressure schedule, scenario text, and assistant
          replies are fully confounded (the measured field cannot be uniquely
          attributed to pressure intensity alone). No group/semigroup/causal/universal
          transfer claim is made. This companion is a descriptive observation from
          the C9 receipt and does not revise C9's supported status or its registered
          verdict.

  - id: c10_postcommitment_detection_receipt
    branch: activation_state_audit
    status: done
    produced_by: experiments/report_public_detection_receipts.py
    artifact: paper_artifacts/c10_postcommitment_detection_receipt.json
    artifact_state: tracked
    metric_summary: >-
      On 1,283 post-commitment events, the relational graph has family-macro Brier 0.0205 versus
      0.0949 for the exact nuisance prior: raw gain 0.07437, compared with nuisance-preserving
      permutation-null mean 0.04347 and maximum 0.05147 (one-sided p=0.0001), leaving observed
      excess over the null mean 0.03089. A raw residual linear probe reaches Brier 0.00150 and wins
      in all 20 families. The eight-family, 242-event deception-versus-knowledge-error secondary
      contrast reaches AUROC 0.949 versus 0.542 for the nuisance prior.
    claim: C10

  - id: c11_precommitment_warning_receipt
    branch: activation_state_audit
    status: done
    produced_by: experiments/report_public_detection_receipts.py
    artifact: paper_artifacts/c11_precommitment_warning_receipt.json
    artifact_state: tracked
    metric_summary: >-
      The one-state spectral field reaches held-out AUROC 0.4168 and the connection-response field
      0.3725. The primary geometry-only risk model has log-loss gain -0.0218
      CI [-0.0733, +0.0233] over nuisance; the secondary sealed-local model loses by -0.0865
      CI [-0.1400, -0.0384]. Twenty token-identical prefixes produce mixed sampled outcomes.
    claim: C11
    descriptive_companions:
      - id: c14_descriptive_representation_structure
        status: unregistered_descriptive
        produced_by: experiments/report_public_representation_receipt.py
        receipt: paper_artifacts/c14_representation_receipt.json
        statement: >-
          On the same sealed structured-action development bank as C11,
          a local source-geometry estimator reconstructs held-out-family
          pre-status displacement with cosine 0.9289 vs 0.4839 global
          (+0.4252 CI [+0.3799, +0.4638], 193/200 roots). Nearest-neighbour
          retrieval reaches 0.9149 (local-minus-nearest +0.0140 CI [+0.0007,
          +0.0284]). The honestward-minus-generic specificity margin is
          +0.0135 CI [+0.0034, +0.0237] (NSE +0.0144), indicating the
          reconstructed field is mostly generic transition displacement.
          Generic-transport displacement across 849 source roots projects
          stably to rank 32 (96.96--96.97% variance retained; rank-32 cosine
          0.8760 vs full 0.8787 vs global 0.1130). A 256-landmark fallback
          reaches 0.8473 and does not meet the frozen selection target. A
          separate post-evidence registered descriptive follow-up on 1,165
          grouped observations finds that a global linear function of
          compositional action and oriented source state reaches family-macro
          cosine 0.8915 vs action-only 0.6808 (delta +0.2107), with an
          endpoint-constrained diagnostic at 0.8205, explaining ~66.3% of
          the additive gain and leaving +0.0710 (fold range +0.0589 to
          +0.0821). All results are retrospective unregistered descriptive or
          post-evidence registered descriptive; none is confirmatory.
        boundary: >-
          Purely descriptive, on the same sealed structured-action
          development banks as C11. The honestward/specificity/compression
          analyses are retrospective unregistered descriptive; the additive
          and endpoint analyses are post-evidence registered descriptive
          follow-ups. No claim is upgraded to supported and none is
          confirmatory. Reconstruction is offline held-out-family
          displacement retrieval, not injection, steering, or control.
          Nearest-neighbour tie shows locality/exemplar selection, not a
          learned field, carries most of the gain. Only one model, one
          developmental bank, one information measure, and one construction
          were tested. Raw banks and held-out labels remain unavailable in
          the public closure.

  - id: c12_steering_decomposition_receipt
    branch: pilot_steering_decomposition
    status: done
    produced_by: experiments/report_public_steering_receipts.py
    artifact: paper_artifacts/c12_steering_decomposition_receipt.json
    artifact_state: tracked
    metric_summary: >-
      Pilot 4-bit bank, 160 rows with 80 deceptive: tangent steering fixes 48 deceptive reports,
      but 40 under the strict endpoint, compared with 37 status fixes for random-gated and 40 for
      each global-gated arm; the gate-routed raw bidirectional-linear arm fixes 1. Every arm has 2
      honest status harms and 10 honest strict harms. A 32-row off-tangent follow-up contains 16
      deceptive pairs (9 versus 1 fixes), giving a retrospectively recalculated paired difference
      +0.500 CI [+0.188, +0.812].
    claim: C12

  - id: c13_gauge_control_receipt
    branch: gauge_control
    status: done
    produced_by: experiments/report_public_gauge_receipt.py
    artifact: paper_artifacts/c13_gauge_control_receipt.json
    artifact_state: tracked
    metric_summary: >-
      The retrospective one-step four-layer structured-action replay has 402 roots, but the frozen
      gauge policy proposes an active supported step on only 21. Gauge-geodesic minus
      no-intervention is 0.0000 CI [0, 0] on both all-root and active-root estimands, with zero
      gauge flips. Generic transport explains the raw-logit reach; the deception-specific
      remainder is +0.0125 CI [-0.0160, +0.0406]. The holonomy instrument clears adequacy in 0/5
      folds, so curvature is not adjudicated.
    claim: C13
    descriptive_companions:
      - id: c14_descriptive_transport_decomposition
        status: unregistered_descriptive
        produced_by: experiments/report_public_representation_receipt.py
        receipt: paper_artifacts/c14_representation_receipt.json
        statement: >-
          A post-evidence registered descriptive follow-up on the same
          structured-action bank evaluates a compositional-action-plus-
          oriented-source additive factorization of transition displacement
          (1,165 grouped observations, 849 source roots, 20 families, rank-32
          PCA). Action-only ridge reaches family-macro cosine 0.6808;
          adding oriented source reaches 0.8915 (delta +0.2107, positive in
          all five folds). An endpoint-prototype diagnostic with source
          matrix fixed to -I reaches 0.8205, explaining ~66.3% of the
          additive gain and leaving +0.0710 (fold range +0.0589 to +0.0821).
          This result is descriptive and post-evidence registered; it does not
          re-open any previously settled claim and does not establish causal
          steering.
        boundary: >-
          Post-evidence registered descriptive follow-up on the same
          structured-action bank as C13. Five-fold consistency is not a
          confidence interval. Desired status and destination program are
          supplied. The result predicts observed activation displacements; it
          is not an additive output-steering method, action selector, or
          intervention. This companion is descriptive only and does not
          revise C13's not-found-under-instrument status.

  - id: c14_representation_structure
    branch: activation_state_audit
    status: done
    produced_by: experiments/report_public_representation_receipt.py
    artifact: paper_artifacts/c14_representation_receipt.json
    artifact_state: tracked
    metric_summary: >-
      Descriptive companion receipt aggregating five private source reports from the sealed
      structured-action development bank. Honestward local retrieval: cosine 0.9289 vs global
      0.4839 (+0.4252 CI [+0.3799, +0.4638] on 193/200 roots). Specificity: honestward-minus-
      generic +0.0135 CI [+0.0034, +0.0237]; mostly generic transition displacement. Compression:
      rank-32 output subspace retains 96.96--96.97% train variance; rank-32 cosine 0.8760 vs
      full 0.8787 vs global 0.1130; 256-landmark fallback 0.8473. Additive factorization:
      action-only 0.6808, source-plus-action 0.8915, delta +0.2107 in all five folds. Endpoint
      diagnostic: constrained 0.8205, gap +0.0710 (fold range +0.0589 to +0.0821), ~66.3%
      explained. All results are unregistered descriptive or post-evidence registered
      descriptive — none is confirmatory.
    claim: C14_DESCRIPTIVE
    descriptive_companions:
      - id: c14_descriptive_representation_structure
        status: unregistered_descriptive
        produced_by: experiments/report_public_representation_receipt.py
        receipt: paper_artifacts/c14_representation_receipt.json
        statement: >-
          See C11 and C13 descriptive_companions for full statement.
        boundary: >-
          Descriptive companion only. No new claim is made. All values are sourced from
          retrospective analyses or post-evidence registered follow-ups. None is confirmatory.

claims:
  - id: C1
    statement: >-
      In the offline structured-action field, policies supplied the correct target can strongly
      correct deceptive status, but the evidence does not establish geometry-specific or
      prospective controller superiority.
    status: supported
    registration_tier: retrospective_synthesis
    boundary: >-
      CNG fixes 599/600 deceptive rows with 1/600 honest harm and exceeds the held-out-family
      route-feature-conditioned ridge at 170/600 fixes and 11/600 harms. A separately conceived
      retrospective, hard-route-matched fixed L16 alpha96 coordinate reaches 600/600 with zero
      harm. The legacy 539/600 comparator was route-mismatched during training selection. These
      are saved-candidate field evaluations, not fresh generation. All three policies receive the
      true target route, and the field itself exposes only corrective-target candidates on the 600
      deceptive rows. CNG adds no selector-side route mask: it scores every candidate available in
      the field by unconstrained argmax and matches the supplied route on all 600 honest rows where
      both targets remain available. The fixed reconstruction explicitly maps route to target.
      The ridge uses route as a feature and selects 233 counter-target candidates, all on honest
      rows, without inspecting held-out candidate outcomes. CNG therefore supports
      held-out-family, pre-response selection inside an oracle-routed structured-action field, but
      the comparison isolates neither target inference nor geometry, and the fixed linear
      coordinate reaches the same ceiling. It is not an end-to-end deception controller; the
      prospective target-free natural-prose controller is tested separately in C5.
    evidence: [c1_matched_control_audit]
    tests: [tests/test_report_powered150_matched_control_audit.py]

  - id: C2
    statement: >-
      A learned dense-dose policy improves generated structured-action correction over the best
      fixed high-dose policy without additional honest harm.
    status: refuted
    registration_tier: retrospective_synthesis
    boundary: >-
      Dense and fixed policies tie on deceptive status and strict fixes, while dense dose adds five
      honest status harms and slightly lowers mean strict reward. This says nothing about dose
      calibration for natural prose.
    evidence: [c2_dose_control_receipt]
    tests: [tests/test_report_public_steering_receipts.py]

  - id: C5
    statement: >-
      A prospectively specified development L16 residual navigation controller improves
      held-out-family natural-prose status correctness at least as much as family-matched linear
      control without honest-row harm.
    status: refuted
    registration_tier: prospective
    boundary: >-
      The native and frequently firing geometric policies fail the machine-scored behavioral
      endpoint, while the linear comparator improves it. Judge-rated honesty or coherence cannot
      rescue the result because perturbation and hedging can move those scores. The frequent policy
      also fires on 37/48 honest rows and 47/48 deceptive rows. Only four held-out families were
      available, so the four family cells are the uncertainty record and family-resampling
      intervals are descriptive. The public receipt identifies this as development-only and does
      not preserve timestamped registration history; it is not confirmatory evidence. This
      experiment tested only an L16 residual controller. An online natural-prose controller that
      attaches novel live typed state at L12/L16/L19/L20 and updates its intervention throughout
      generation was not built within the study's time and compute budget. Its outcome is unknown
      and cannot rescue C5.
    evidence: [c5_natural_prose_control_receipt]
    tests: [tests/test_report_public_natural_prose_control_receipt.py]

  - id: C9
    statement: >-
      Under graded conversational pressure, smooth escalation increases deceptive commitment and
      current intensity predicts commitment, while the tested cumulative-history term and the
      registered smooth-versus-step approach-geometry contrast add no held-out signal.
    status: supported
    registration_tier: retrospective_synthesis
    boundary: >-
      One Llama-3.1-8B-Instruct model, development banks, and blinded LLM-judge labels from three
      separate calls to one judge model/family that have not been human-validated. The P3 commitment axis is adequate for its registered test, but its
      drift contrast crosses zero. Headline arm intervals are conversation-level Wilson/Newcombe,
      not family-clustered. The dissociation analysis uses 84/96 source conversations after
      registered exclusions and retains intensity/history correlation +0.332. Neither general
      memorylessness nor out-of-distribution transfer is claimed, and failures of scripted-arm
      realization remain part of the record.
    evidence: [c9_pressure_commitment_receipt]
    tests: [tests/test_report_public_natpress_receipt.py]

  - id: C10
    statement: >-
      Post-commitment activations decode deceptive versus honest actions beyond exact nuisance
      controls, but a raw residual linear probe outperforms the relational graph.
    status: supported
    registration_tier: post_hoc_registered
    boundary: >-
      The graph's raw Brier gain is partly reproduced by the nuisance-preserving permutation null;
      its observed excess over the null mean is 0.03089. The same-bank linear probe has lower Brier
      in all 20 families. The exact nuisance prior is truth-blind: it keys on the sampled status
      token, turn, intervention history, and pressure exposure, but not scenario truth, while the
      deceptive label is defined relative to scenario truth. A truth-aware re-score with the
      decision rule registered in docs/experiment_design.md (2026-07-27) finds the residual is
      not retained: the truth-aware prior reaches Brier 0.02748, the graph's gain over it is
      +0.00696 with a family-cluster bootstrap CI that does not exclude zero (16/20 families
      positive), verdict refuted-under-adequate-instrument, while the permutation null still
      rejects (excess +0.0309, p=1e-4). The truth-aware key contains the label's defining
      arguments, so this bounds utility over the design cell rather than the existence of
      information beyond metadata, and the 20-cluster bootstrap cannot distinguish a
      negligible residual from a small real one. The linear probe beats the truth-aware
      prior by +0.02598. This is post-action decodability on a single
      development bank, not early warning, causal control, or evidence that relational geometry
      is necessary.
    evidence: [c10_postcommitment_detection_receipt]
    tests: [tests/test_report_public_detection_receipts.py]

  - id: C11
    statement: >-
      The tested pre-commitment spectral, connection-response, and masked geometry-only fields
      improve risk prediction over matched design or nuisance baselines.
    status: refuted
    registration_tier: retrospective_synthesis
    boundary: >-
      All three tested fields fail their registered comparator. The 20 mixed-outcome,
      token-identical prefixes establish an empirical stochastic floor for exact deterministic
      prediction on those states, not a universal impossibility result for pre-action warning.
      The registered comparators are truth-aware (keyed on true and desired status) while the
      tested geometry is barred from those fields. Descriptively, the same underlying artifact
      contains receipt-bound raw AUROC scores: geometry-only 0.9442, nuisance-only 0.9446,
      nuisance-plus-geometry 0.9537, sealed nuisance 0.9489. This is an explicitly descriptive
      secondary ordering; the registered refutation stands on the sealed-prior endpoint.
    evidence: [c11_precommitment_warning_receipt]
    tests: [tests/test_report_public_detection_receipts.py]

  - id: C12
    statement: >-
      In the pilot steering bank, tangent steering has the largest status-correction point, but
      matched gate-routed random and global directions recover much of it; the nonfactorial audit
      does not identify a separate tangent-geometry contribution.
    status: supported
    registration_tier: retrospective_synthesis
    boundary: >-
      The primary bank contains 160 rows, with the /80 correction denominator referring only to
      deceptive rows; status and strict endpoints differ, and every arm has 10 honest strict harms.
      The raw bidirectional-linear arm uses the same held-out-family gate, routing, and abstention
      rule as the other bidirectional arms; it is unprojected, not ungated. The off-tangent effect
      uses 16 deceptive pairs and is an explicitly retrospective recalculation. Direction, gate,
      dose, and token scope were not crossed factorially. This mixed-precision 4-bit,
      conditional-routing pilot establishes neither end-to-end selectivity nor the behavior of
      the larger structured-action field.
    evidence: [c12_steering_decomposition_receipt]
    tests: [tests/test_report_public_steering_receipts.py]

  - id: C13
    statement: >-
      Gauge-geodesic or holonomy geometry yields deception-specific causal control leverage or
      instrument-resolvable curvature.
    status: not_found_under_instrument
    registration_tier: retrospective_synthesis
    boundary: >-
      Gauge-geodesic replay is behaviorally null and the transport-specific remainder crosses
      zero. This was a retrospective one-step four-layer structured-action controller that
      authenticated live roots against sealed source-bank queries; only 21/402 roots received an
      active supported step. It was not a prospective end-to-end natural-prose controller with
      novel online state attachment and updates across generation. The holonomy instrument fails
