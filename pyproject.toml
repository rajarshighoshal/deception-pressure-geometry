[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deception-pressure-geometry"
version = "0.1.0"
description = "Auditing activation-space detection and control of pressure-induced deceptive commitment."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "accelerate>=0.27",
  "datasets>=2.18",
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "POT==0.9.6.post1",
  "geoopt>=0.5",  # Poincare-ball primitives for the hyperbolic probe
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "einops>=0.7",
  "safetensors>=0.4",
  "matplotlib>=3.8",
  # Apple-Silicon generation backend; skipped on Linux/servers via marker.
  "mlx>=0.31; sys_platform == 'darwin'",
  "mlx-lm>=0.31; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

# uv syncs this group by default, so `uv sync` leaves pytest/ruff installed
# and the quickstart in README.md works as written.
[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
